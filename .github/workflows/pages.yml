name: Pages

# Builds the game for the browser and serves it; and puts its level where it can be streamed.
#
# The game is compiled here: Rust to WebAssembly, against the Solstice engine at the commit
# engine.txt names. The level is not: it takes Blender and a good many minutes to build, so
# it is built on a PC and published as a release (tools/publish-scene.sh), which scene.txt
# names with its SHA-256.
#
# The game streams the level by HTTP Range, which a release download cannot serve to a page
# on another origin, and Pages will not deploy a site of half a gigabyte. So the first job
# takes the level from its release, checks it, and hosts it in parts under refs/scene/ in
# this repository, where raw.githubusercontent.com serves it with ranges and CORS
# (tools/host-scene.sh). The site itself is then only the game, told where its level is.

on:
  push:
    branches: [main]
    # Neither the documentation nor the art scripts change what the site serves.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "art/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scene:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.host.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Host the scene
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(bash tools/host-scene.sh)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "The level is served from $url" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: scene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the engine
        run: bash tools/setup-engine.sh

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # The web build has a target folder of its own, and installs wasm-bindgen beside it.
          workspaces: ". -> target/web"
          cache-directories: build/tools

      - name: Build the site
        env:
          SCENE_URL: ${{ needs.scene.outputs.url }}
        run: |
          [ -n "$SCENE_URL" ] || { echo "the scene job gave no address for the level" >&2; exit 1; }
          bash tools/build-web.sh --scene-url "$SCENE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
