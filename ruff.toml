# Lints for the art scripts and tools. Most run inside Blender, so `bpy` and `mathutils` are
# imported after the scripts put art/ on sys.path; their E402s are marked where they occur.
target-version = "py311"

[lint]
# Ruff's own defaults, spelled out so that a machine's global settings don't change them.
select = ["E4", "E7", "E9", "F"]
